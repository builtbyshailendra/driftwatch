name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive testdata/workspaces
      - name: terraform validate
        working-directory: testdata/workspaces
        run: |
          for ws in drift sensitive; do
            (cd "$ws" && terraform init -input=false -backend=false && terraform validate)
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: End-to-end test with real terraform
        env:
          DRIFTWATCH_E2E: "1"
        run: go test ./internal/cli -run EndToEnd -v
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: make build
      - name: Smoke test
        run: |
          ./bin/driftwatch version
          ./bin/driftwatch check --plan-json testdata/plans/clean.json --exit-code --format none
      - name: README demo matches examples/sample-report.md
        run: |
          set +e
          ./bin/driftwatch check --plan-json testdata/plans/drift.json --workspace payments-prod \
            --ignore-file examples/driftignore --exit-code > "$RUNNER_TEMP/demo.md"
          code=$?
          set -e
          test "$code" = 2
          diff <(grep -v '^Generated ' examples/sample-report.md) <(grep -v '^Generated ' "$RUNNER_TEMP/demo.md")
      - name: Build container image
        run: docker build --build-arg VERSION=${{ github.sha }} -t driftwatch:ci .
      - name: Container smoke test
        run: |
          docker run --rm -v "$PWD/testdata/plans:/plans:ro" driftwatch:ci \
            check --plan-json /plans/drift.json --workspace container --format none

  action:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Run the action against a recorded plan
        id: drift
        uses: ./action
        with:
          plan-json: testdata/plans/drift.json
          workspace: ci-fixture
          ignore-file: examples/driftignore
          create-issue: "false"
      - name: Assert outputs
        run: |
          test "${{ steps.drift.outputs.has-drift }}" = "true"
          grep -q "Terraform drift report: ci-fixture" "${{ steps.drift.outputs.report-markdown }}"
          grep -q '"has_drift": true' "${{ steps.drift.outputs.report-json }}"
